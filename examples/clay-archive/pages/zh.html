<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陶器档案</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf4e8;color:#25291e}
main{max-width:1400px;margin:auto;padding:0 20px 48px;font:16px/1.5 var(--body),sans-serif}
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding-block:24px;border-bottom:1px solid #cec5af}
.mast h1,.section-title{font-family:var(--headline),serif;font-weight:400;margin:0}
.mast h1{max-width:12em;overflow-wrap:anywhere}
.language{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #736d5d;border-radius:50px;color:inherit;text-decoration:none;font:13px/1.4 var(--label),sans-serif}
.language:focus-visible{outline:2px solid #8f492d;outline-offset:4px}
.intro{margin:24px 0 28px;max-width:43ch}
.eyebrow{margin:0;color:#8f492d;display:flex;align-items:center;gap:8px;font:13px/1.4 var(--label),sans-serif}
.glyph{display:inline-flex;color:#53634a}
.glyph svg{width:22px;height:22px;display:block}
.section-title{border-bottom:1px solid #cec5af;padding-bottom:8px;margin-bottom:16px}
.records{display:grid;gap:16px;grid-template-columns:1fr}
.record{min-width:0;background:#f5efe1;padding:12px;border-radius:12px}
.record img{display:block;width:100%;height:200px;object-fit:contain;border-radius:12px;background:#e9e4d5}
.record h3{display:flex;align-items:center;gap:8px;margin:12px 0 0}
.record p{margin:4px 0 0;color:#53634a;font-size:14px}
@media(min-width:640px){.records{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.records{grid-template-columns:repeat(3,minmax(0,1fr))}.record img{height:250px}}
</style>
<link href="../style/page-typography.css" rel="stylesheet" data-stitch-page-typography></head>
<body><main style="--headline:'Noto Serif SC';--label:'DengXian';--body:'Noto Sans SC'">
<header class="mast" data-stitch-container="header"><h1 data-stitch-type="page_title">窑中器物</h1><a class="language" href="en.html" lang="en" data-route-key="en" data-doop-name="link_language">English</a></header>
<div class="intro" data-doop-name="intro"><p class="eyebrow"><span class="glyph" data-icon="studio"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-7 9 7M6 10v10h12V10M10 20v-5h4v5"/></svg></span>陶器档案</p><p>从三件工作室器物，看小窑烧成的形制与表面。</p></div>
<section aria-labelledby="collection"><h2 class="section-title" id="collection" data-stitch-type="section_title">馆藏器物</h2>
<div class="records">
<article class="record" data-doop-name="record_bowl">
  <img class="asset-image" src="../asset/raw/photos/landscape.png" data-asset="landscape" alt="青釉浅碗">
  <h3 data-stitch-type="subsection_title"><span class="glyph" data-icon="bowl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18a9 9 0 0 1-18 0Zm6 10h6"/></svg></span>青釉浅碗</h3><p>淡青釉覆盖宽口浅腹。</p>
</article>
<article class="record" data-doop-name="record_vessel">
  <img class="asset-image" src="../asset/raw/photos/portrait.png" data-asset="portrait" alt="赤陶长罐">
  <h3 data-stitch-type="subsection_title"><span class="glyph" data-icon="vessel"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-5 0v5l-4 5v5l3 3h6l3-3v-5l-4-5V3"/></svg></span>赤陶长罐</h3><p>红褐胎土，收口细窄。</p>
</article>
<article class="record" data-doop-name="record_kettle">
  <img class="asset-image" src="../asset/raw/photos/square.png" data-asset="square" alt="铁釉提梁壶">
  <h3 data-stitch-type="subsection_title"><span class="glyph" data-icon="kettle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8v3l3 4-2 4H7l-2-4 3-4v-3Zm1 0V6a3 3 0 0 1 6 0v4M7 14l-5-2"/></svg></span>铁釉提梁壶</h3><p>深色釉面，提梁带折角。</p>
</article>
</div></section></main></body></html>
